name: Build Sistema ATC

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: |
        pip install pyinstaller
        pip install openpyxl
        
    - name: Compilar para Windows
      run: |
        pyinstaller --onefile --name "SistemaATC" app.py
        
    - name: Subir ejecutable Windows
      uses: actions/upload-artifact@v4
      with:
        name: SistemaATC-Windows
        path: dist/SistemaATC.exe

  build-mac:
    runs-on: macos-latest
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: |
        pip install pyinstaller
        pip install openpyxl
        
    - name: Compilar para macOS
      run: |
        pyinstaller --onefile --windowed --name "SistemaATC" app.py
        
    - name: Subir ejecutable macOS
      uses: actions/upload-artifact@v4
      with:
        name: SistemaATC-macOS
        path: dist/SistemaATC.app
